x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    DATA_PATH: /opt/airflow/data/raw
    PYTHONPATH: /opt/airflow/spark
    POSTGRES_JAR_PATH: /opt/airflow/jars/postgresql-42.7.3.jar
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: smh_db
    POSTGRES_USER: smh_user
    POSTGRES_PASSWORD: smh_pass
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins
    - ../spark:/opt/airflow/spark
    - ../data:/opt/airflow/data
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - smh-network

services:

  # Pipeline Database
  postgres:
    image: postgres:14
    container_name: smh-postgres
    environment:
      POSTGRES_USER: smh_user
      POSTGRES_PASSWORD: smh_pass
      POSTGRES_DB: smh_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - smh-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smh_user", "-d", "smh_db"]
      interval: 5s
      retries: 5

  # Spark
  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: smh-spark
    environment:
      - SPARK_MODE=master
    volumes:
      - ../:/app
    working_dir: /app
    command: tail -f /dev/null
    networks:
      - smh-network

  # Airflow Metadata Database
  airflow-postgres:
    image: postgres:14
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    networks:
      - smh-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Airflow Init (One-time setup)
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: on-failure

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

networks:
  smh-network:
    driver: bridge

volumes:
  pg_data:
  airflow_pg_data: